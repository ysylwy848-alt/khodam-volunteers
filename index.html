<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدام مكة المكرمة - تسجيل الدخول</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="login.js" defer></script>
</head>

<body>

<div class="login-box">

    <h1>خدام مكة المكرمة</h1>
    <p>نظام إدارة المتطوعين</p>

    <input
        type="text"
        id="volunteer_id"
        placeholder="رقم التطوع">

    <input
        type="password"
        id="password"
        placeholder="الرقم السري">

    <button id="loginBtn">
        تسجيل الدخول
    </button>

</div>

</body>
</html>
