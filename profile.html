<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js" defer></script>
    <script src="profile.js" defer></script>
</head>

<body>

<div class="login-box">

    <h1>الملف الشخصي</h1>

    <h2 id="full_name"></h2>

    <p><strong>رقم التطوع:</strong> <span id="volunteer_id"></span></p>
    <p><strong>القسم:</strong> <span id="department"></span></p>
    <p><strong>الرتبة:</strong> <span id="rank"></span></p>
    <p><strong>النقاط:</strong> <span id="points"></span></p>
    <p><strong>الساعات:</strong> <span id="hours"></span></p>
    <p><strong>الحالة:</strong> <span id="status"></span></p>

    <button id="logoutBtn">تسجيل الخروج</button>

</div>

</body>

</html>
